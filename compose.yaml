name: firetv-control

services:
  firetv:
    build: .
    image: firetv-control:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      FIRETV_DEVICE: "${FIRETV_DEVICE:-}"
    volumes:
      - firetv-state:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s

volumes:
  firetv-state:
