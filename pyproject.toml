[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firetv-control"
version = "0.2.0"
description = "Local Fire OS manager with browser video, apps, files, remote control and Docker Compose"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/GustavoHSCruz/firetv-control"
Issues = "https://github.com/GustavoHSCruz/firetv-control/issues"

[project.scripts]
firetv-control = "firetv_control.cli:main"

[tool.setuptools.packages.find]
include = ["firetv_control*"]
namespaces = true

[tool.setuptools.package-data]
"firetv_control" = ["static/*"]
